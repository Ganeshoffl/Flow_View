name: CI

on:
  push:
    branches: [main, development/flow-view-completion]
  pull_request:

# A run in progress on a branch is worthless once a newer commit lands on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      # The model is the single source of truth. If generated artifacts are stale, the types no
      # longer describe the schema and everything downstream is checked against a fiction.
      - name: Schema artifacts are current
        run: pnpm schema:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi uvicorn httpx httpx2 websockets

      - name: Install GDB for C tracing
        run: sudo apt-get update -qq && sudo apt-get install -y gdb

      - name: Python tests
        run: |
          if ! PYTHONPATH=packages/trace-schema/python:adapters/python \
            python -m pytest packages/trace-schema/python/tests adapters/python/tests \
                             adapters/native/tests apps/server/tests conformance/tests -q \
                             > "$RUNNER_TEMP/python-tests.log" 2>&1; then
            python -I -c 'import os,pathlib; text=(pathlib.Path(os.environ["RUNNER_TEMP"])/"python-tests.log").read_text(encoding="utf-8",errors="replace")[-5500:]; print("::error title=Python tests failed::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
          python -I -c 'import os,pathlib; print((pathlib.Path(os.environ["RUNNER_TEMP"])/"python-tests.log").read_text(encoding="utf-8",errors="replace").splitlines()[-1])'

      # Must run before the TypeScript suite: the replay tests verify real adapter output, and this
      # is what produces it. They fail rather than skip if it is missing.
      - name: Conformance corpus
        run: python conformance/runner.py

      - name: Backend comparison
        run: python conformance/backends.py

      - name: TypeScript tests
        run: pnpm test

      - name: Build the web app
        run: pnpm --filter @flow-view/web build

      - name: Exercise installed wheel outside checkout
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/flow-view-wheels"
          python -m pip install --no-deps --target "$RUNNER_TEMP/flow-view-site" "$RUNNER_TEMP"/flow-view-wheels/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/verify-wheel.py" "$RUNNER_TEMP/flow-view-site"
