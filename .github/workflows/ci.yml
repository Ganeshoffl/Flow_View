name: CI

on:
  push:
    branches: [main]
  pull_request:

# A run in progress on a branch is worthless once a newer commit lands on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      # The model is the single source of truth. If generated artifacts are stale, the types no
      # longer describe the schema and everything downstream is checked against a fiction.
      - name: Schema artifacts are current
        run: pnpm schema:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: TypeScript tests
        run: pnpm test

      - name: Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          PYTHONPATH=packages/trace-schema/python python -m pytest packages/trace-schema/python/tests -q

      - name: Build the web app
        run: pnpm --filter @flow-view/web build
