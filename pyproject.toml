[project]
name = "flow-view"
version = "0.1.0"
description = "See what your code does while it runs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Deliberately empty. The tracer must run unchanged inside Pyodide, so it cannot depend on anything
# outside the standard library. Server dependencies arrive in Phase 1 as an optional extra.
dependencies = []

[project.optional-dependencies]
# The server half. Kept optional because the core must stay dependency-free: the tracer has to run
# unchanged inside Pyodide for the Lite profile, and anything declared here would follow it there.
# `websockets` is not optional in practice. Every run streams over a WebSocket, and bare uvicorn ships
# no WebSocket implementation - so without it the install succeeds, the UI loads, and every run fails to
# connect. Named explicitly rather than pulling uvicorn[standard], which also brings uvloop, httptools,
# watchfiles and a YAML parser that none of this uses.
server = ["fastapi>=0.110", "uvicorn>=0.27", "websockets>=12"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
flow-view = "flow_view_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# All three, because the server spawns the tracer as a subprocess and both speak the schema. Shipping
# only the schema made `pip install flow-view` produce a package with no tracer and no `flow-view`
# command, while the UI told people to run exactly that.
packages = [
  "packages/trace-schema/python/flow_view_schema",
  "adapters/python/flow_view_tracer",
  "apps/server/flow_view_server",
]

# The built UI travels inside the package, so an installed copy serves its own interface from its own
# origin and needs no dev server and no network. Build it first: pnpm --filter @flow-view/web build
[tool.hatch.build.targets.wheel.force-include]
"apps/web/dist" = "flow_view_server/static"

[tool.pytest.ini_options]
testpaths = ["packages/trace-schema/python/tests", "adapters"]
pythonpath = ["packages/trace-schema/python"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["packages/trace-schema/python/flow_view_schema/events.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["packages/trace-schema/python/flow_view_schema"]
# Generated code is checked by the generator's own tests, not by hand-written annotations.
exclude = ["events\\.py$"]
